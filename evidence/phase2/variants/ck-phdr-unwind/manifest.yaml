patch_partition_divergence: |
  The 4-patch partition matches the brief exactly:
    1. phdr-cache (uncomment override in be/src/common/phdr_cache.cpp).
    2. phdr-cache-init (uncomment updatePHDRCache() in doris_main.cpp).
    3. native-stack-collector (libunwind walk in native_stack_collect.cpp).
    4. build-system (Tier 2 jemalloc rebuild hook; libunwind link is already in place).
  No per-variant test patch (5) is shipped this round: the brief listed it
  as optional, and ck-phdr-unwind ships no variant-specific cases.
  Case 14/15/17 are fp-walk-specific (RBP bounds, WALKING-state pause,
  junk-RBP); libunwind handles its own bounds via DWARF, so a parallel
  case set adds no coverage for this variant.
