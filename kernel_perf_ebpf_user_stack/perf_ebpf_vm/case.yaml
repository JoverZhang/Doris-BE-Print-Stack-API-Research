case_id: perf_ebpf_vm
title: VM perf/eBPF + Grafana Alloy/Pyroscope profiling route
category: kernel_perf_ebpf_user_stack
owner: Papaya
task: 20
status: in_progress

requires:
  root: true
  vm: true
  network: true
  debug_info: optional
  frame_pointer: optional
  kernel_capabilities:
    - CAP_PERFMON or root
    - CAP_BPF or root
    - CAP_SYS_ADMIN may be needed on older kernels/tools
    - tracefs
    - BTF recommended

environment:
  host_os: null
  kernel: null
  cpu: null
  virtualization: qemu-kvm
  notes: "Must be populated from VM results/latest/environment.txt after runtime."

release:
  project: Linux perf/eBPF + Grafana Alloy pyroscope.ebpf
  source_url: "https://grafana.com/docs/alloy/latest/reference/components/pyroscope/pyroscope.ebpf/"
  tag: Ubuntu 24.04 guest kernel + distro perf/bpftrace + Grafana Alloy package
  commit: null
  build_id: null
  acquisition: package

commands:
  build: scripts/build_target.sh
  run: scripts/run.sh
  clean: null
  extra:
    - scripts/install_deps.sh
    - scripts/run_perf.sh
    - scripts/run_bpftrace.sh
    - scripts/run_industry_profiler.sh

outputs:
  samples:
    - results/latest/perf_summary.txt
    - results/latest/bpftrace_summary.txt
    - results/latest/industry_profiler_summary.txt
  logs:
    - results/latest/environment.txt
    - results/latest/alloy.stderr
    - results/latest/target_*.log
  artifacts:
    - results/latest/*.data
    - results/latest/*.script
    - results/latest/*.report
    - results/latest/alloy_metrics.prom

validates:
  - perf child-process user-stack sampling with FP and DWARF callgraphs
  - perf same-process attach and system-wide sampling in VM/root environment
  - bpftrace ustack on-CPU sampling
  - bpftrace sched_switch/off-CPU event evidence
  - Grafana Alloy pyroscope.ebpf sending continuous profiles to local Pyroscope
  - semantic boundary between profiling samples and all-thread current snapshots

evidence:
  real_project_run:
    status: BLOCKED
    notes: "Guest scripts are ready; VM image/SSH runtime from task #16 has not yet been used by this case."
  source_mapping:
    status: PASS
    files:
      - src/profile_target.cpp
      - bpftrace/profile_ustack.bt
      - bpftrace/offcpu_sched_switch.bt
      - alloy/pyroscope_ebpf.alloy.template
  minimal_implementation:
    status: PASS
    path: src/profile_target.cpp
