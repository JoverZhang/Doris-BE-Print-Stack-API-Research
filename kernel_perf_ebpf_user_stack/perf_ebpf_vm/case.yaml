case_id: perf_ebpf_vm
title: VM perf/eBPF + Grafana Alloy/Pyroscope profiling route
category: kernel_perf_ebpf_user_stack
owner: Papaya
task: 20
status: PASS

requires:
  root: true
  vm: true
  network: true
  debug_info: optional
  frame_pointer: optional
  kernel_capabilities:
    - CAP_PERFMON or root
    - CAP_BPF or root
    - CAP_SYS_ADMIN may be needed on older kernels/tools
    - tracefs
    - BTF recommended

environment:
  host_os: Ubuntu 24.04 QEMU guest
  kernel: 6.8.0-111-generic
  cpu: QEMU/KVM host CPU
  virtualization: qemu-kvm
  notes: "Runtime evidence captured in outputs/vm_latest/environment.txt with perf_event_paranoid=-1, kptr_restrict=0, BTF/tracefs/debugfs present."

release:
  project: Linux perf/eBPF + Grafana Alloy pyroscope.ebpf
  source_url: "https://grafana.com/docs/alloy/latest/reference/components/pyroscope/pyroscope.ebpf/"
  tag: Ubuntu 24.04 guest kernel + distro perf/bpftrace + Grafana Alloy package
  commit: "perf 6.8.12, bpftrace 0.20.2, Grafana Alloy v1.16.1, Docker 29.1.3"
  build_id: null
  acquisition: package

commands:
  build: scripts/build_target.sh
  run: scripts/run.sh
  clean: null
  extra:
    - scripts/install_deps.sh
    - scripts/run_perf.sh
    - scripts/run_bpftrace.sh
    - scripts/run_industry_profiler.sh

outputs:
  samples:
    - outputs/vm_latest/perf_summary.txt
    - outputs/vm_latest/bpftrace_summary.txt
    - outputs/vm_latest/industry_profiler_summary.txt
    - outputs/vm_latest/bpftrace_profile_ustack.stdout
    - outputs/vm_latest/bpftrace_offcpu_sched_switch.stdout
  logs:
    - outputs/vm_latest/environment.txt
    - outputs/vm_latest/alloy.stderr
    - outputs/vm_latest/pyroscope.log
  artifacts:
    - outputs/vm_latest/alloy_metrics.prom

validates:
  - perf child-process user-stack sampling with FP and DWARF callgraphs
  - perf same-process attach and system-wide sampling in VM/root environment
  - bpftrace ustack on-CPU sampling
  - bpftrace sched_switch/off-CPU event evidence
  - Grafana Alloy pyroscope.ebpf sending continuous profiles to local Pyroscope
  - semantic boundary between profiling samples and all-thread current snapshots

evidence:
  real_project_run:
    status: PASS
    notes: "Executed inside task #16 Ubuntu 24.04 QEMU VM. perf FP/DWARF attach/system-wide, bpftrace profile/off-CPU probes, and Grafana Alloy pyroscope.ebpf to local Pyroscope all produced runtime evidence."
  source_mapping:
    status: PASS
    files:
      - src/profile_target.cpp
      - bpftrace/profile_ustack.bt
      - bpftrace/offcpu_sched_switch.bt
      - alloy/pyroscope_ebpf.alloy.template
  minimal_implementation:
    status: PASS
    path: src/profile_target.cpp
    notes: "Synthetic target creates CPU-running, sleeping, and mutex-blocked native threads."

output_capability:
  raw_pc: yes
  symbol: yes
  file_line: partial
  inline_frames: partial
  thread_context_registers: no
  all_native_threads: no
  selected_thread: partial
  coroutine_or_bthread: no
  minidump: no

safety_and_impact:
  live_diagnostic_api_fit: no
  crash_or_minidump_semantics: false
  requires_signal: false
  requires_ptrace: false
  requires_debug_info: true
  requires_frame_pointer: true
  known_disturbance: "Sampling/profiling overhead; system-wide eBPF/perf requires privileged VM/root environment. On-CPU samples only covered the two CPU worker TIDs in a six-thread target."
  timeout_or_partial_failure: "Sampling windows may miss sleeping/blocked threads unless a relevant event such as sched_switch fires."

boundaries:
  - "profiling samples are not synchronous all-thread snapshots"
  - "on-CPU sampling does not guarantee coverage of sleeping or blocked threads"
  - "industry profiler route is continuous profiling, not on-demand dump API"

blockers: []

decision:
  recommendation: PASS_AS_PROFILING_ROUTE_ONLY
  reason: "VM/root execution proves perf, bpftrace, and Alloy/Pyroscope eBPF user-stack profiling are viable. The evidence also shows the semantic boundary: on-CPU profiling sampled only CPU-running threads and is not an on-demand all-thread current stack snapshot."
  next_step: "Keep as industry profiling/reference route. Do not promote to Doris BE live all-thread dump API without a separate snapshot mechanism."
