  timeout_or_partial_failure: "Sampling windows may miss sleeping/blocked threads unless a relevant event such as sched_switch fires."

boundaries:
  - "profiling samples are not synchronous all-thread snapshots"
  - "on-CPU sampling does not guarantee coverage of sleeping or blocked threads"
  - "industry profiler route is continuous profiling, not on-demand dump API"

blockers:
