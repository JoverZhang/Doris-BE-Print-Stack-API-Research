case_id: clickhouse_system_stack_trace
title: ClickHouse system.stack_trace release reproduction with debug-info and FP/no-FP backend control
category: in_process_directed_signal_with_local_unwind
owner: Guava
task: 17
status: PASS

requires:
  root: false
  vm: false
  network: true
  debug_info: required_for_file_line
  frame_pointer: optional
  kernel_capabilities: []
  packages:
    - curl
    - tar
    - coreutils
    - binutils
    - g++
    - libunwind-dev

environment:
  host_os: linux x64
  kernel: host
  cpu: host
  virtualization: baremetal
  notes: Runs ClickHouse official static release locally on 127.0.0.1:19000.

release:
  project: ClickHouse
  source_url: https://github.com/ClickHouse/ClickHouse
  tag: v26.3.10.62-lts
  commit: e1c11930c28196f954a93287e43c1aa112c8c607
  build_id: 6eb1953afad1495bf822a2e45c41166d34390877
  acquisition: official-binary

commands:
  build: scripts/download_clickhouse.sh && scripts/download_clickhouse_debug.sh
  run: scripts/run.sh
  clean: scripts/clean.sh
  extra:
    - scripts/run_fp_no_fp_control.sh

outputs:
  samples:
    - outputs/raw_trace.txt
    - outputs/symbol_names.txt
    - outputs/file_lines.txt
    - outputs/file_lines_filtered.txt
    - outputs/inline_lines.txt
    - outputs/fp_control/depth_summary.csv
  logs:
    - outputs/phase1b_summary.txt
    - outputs/debug_info_layout.txt
    - outputs/debug_package.sha256
    - outputs/clickhouse_build_id.txt
    - outputs/clickhouse_debug_build_id.txt
  artifacts: []

validates:
  - system_stack_trace_query
  - raw_pc_array
  - symbol_names
  - file_line_with_debug_info
  - inline_file_line_with_debug_info
  - fp_no_fp_backend_control

evidence:
  real_project_run:
    status: PASS
    notes: Official ClickHouse release server was started and queried through system.stack_trace.
  source_mapping:
    status: PASS
    files:
      - src/Storages/System/StorageSystemStackTrace.cpp
      - src/Common/StackTrace.cpp
      - src/Common/SymbolIndex.cpp
  minimal_implementation:
    status: PASS
    path: fp_control/backend_control.cpp
    notes: Controlled backend/build comparison only; not a second ClickHouse user API.

output_capability:
  raw_pc: yes
  symbol: yes
  file_line: yes
  inline_frames: yes
  thread_context_registers: no
  all_native_threads: yes
  selected_thread: partial
  coroutine_or_bthread: no
  minidump: no

safety_and_impact:
  live_diagnostic_api_fit: conditional
  crash_or_minidump_semantics: false
  requires_signal: true
  requires_ptrace: false
  requires_debug_info: true
  requires_frame_pointer: false
  known_disturbance: Sequential directed signal with timeout; not benchmarked here.
  timeout_or_partial_failure: storage_system_stack_trace_pipe_read_timeout_ms=100ms; empty traces are possible.

boundaries:
  - FP/no-FP is a backend/build-condition comparison, not two ClickHouse user APIs.
  - Large release/debug archives and clickhouse.debug are cache files and are gitignored.
  - Debug-info file-line proof depends on matching build ID.

blockers: []

decision:
  recommendation: PASS
  reason: Raw trace, symbol, file-line, inline file-line, and backend FP/no-FP control evidence are reproduced.
  next_step: Use this case as the in-process directed-signal reference for Doris BE repo-level comparisons.
